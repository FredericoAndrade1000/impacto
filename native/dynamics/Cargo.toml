[package]
name = "batalha-dynamics"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build", "native-parallel"]
native-parallel = ["rapier2d-f64/parallel"]
typegen = ["dep:ts-rs"]

[[bin]]
name = "export-typescript"
path = "src/bin/export_typescript.rs"
required-features = ["typegen"]

[dependencies]
# These are the versions used by @dimforge/rapier2d-compat 0.21.0,
# published from dimforge/rapier commit b716d375efc0201003f0cd9ef7168eee0b62c177.
# A world is written out whole and taken back to the last bit (`NativeWorld::export_state`): Rapier's own state with
# its serde, and the rest in MessagePack, which says every f64 as it is.
rapier2d-f64 = { version = "=0.36.0", features = ["enhanced-determinism", "serde-serialize"] }
parry2d-f64 = "=0.31.1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
rmp-serde = "=1.3.1"
sha2 = "=0.10.9"
ryu-js = "=1.0.2"
napi = { version = "=3.14.2", optional = true }
napi-derive = { version = "=3.6.12", optional = true }
ts-rs = { version = "=12.0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[build-dependencies]
napi-build = { version = "=2.6.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
